name: texticode_mobile
description: "Texticode - Sistema de gestión textil (versión móvil)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  http: ^1.2.0 # usuario_repository.dart depende de este paquete
  pdf: ^3.10.7 # generación del PDF
  printing: ^5.12.0 # vista previa + compartir/guardar/imprimir

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/